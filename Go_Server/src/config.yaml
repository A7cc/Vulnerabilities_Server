# 项目端口
server:
  port: 8081

# 数据库配置
db:
  dialects: mysql
  host: db
  port: 3306
  db: vul_server
  username: root
  password: root
  charset: utf8mb4
  # 最大空闲数
  maxIdle: 50
  # 最大连接数
  max0pen: 150

# 静态资源
staticData: ./static/

# 上传地址和ip
uploadDir: ./static/uploads/

# 备份数据库路径
backupsdbDir: ./static/backupdb/

# 解压路径
zipDir: ./static/zipfile/

# 日志配置
logpath: ./static/log
